name: Katalog aktualisieren und veröffentlichen

# Holt täglich den Game-Pass-Katalog, schlägt neue Spiele bei Metacritic/HLTB/Steam nach
# (bekannte kommen aus data/cache), checkt die Daten ein und veröffentlicht die Seite auf GitHub Pages.
on:
  schedule:
    - cron: "15 5 * * *"
  push:
    branches: [main]
    paths-ignore: ["data/**", "public/data/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Daten holen
        if: github.event_name != 'push'
        run: python -X utf8 scripts/build_data.py
      - name: Daten einchecken
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/data
          git diff --cached --quiet || git commit -m "Katalog $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash -q || true
          git push
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
