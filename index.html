<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Game Pass Filter</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%23107c10'/><path d='M9 10l14 12M23 10L9 22' stroke='white' stroke-width='3.5' stroke-linecap='round'/></svg>" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <button id="toggleFilters" class="icon-btn" aria-label="Filter ein-/ausblenden" title="Filter">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 5h18M6 12h12M10 19h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
      <h1>Game Pass <span>Filter</span></h1>
      <nav class="tabs">
        <button data-tab="all">Alle Spiele</button>
        <button data-tab="list">Meine Liste <span id="listCount" class="tab-count"></span></button>
      </nav>
      <input id="search" type="search" placeholder="Spiel suchen …" autocomplete="off" />
      <label class="sort">
        <span>Sortieren</span>
        <select id="sort"></select>
      </label>
    </header>
    <div class="layout">
      <aside id="filters" class="filters"></aside>
      <main>
        <div class="resultbar">
          <span id="count"></span>
          <div id="activeChips" class="active-chips"></div>
          <button id="shareList" class="chip share" hidden>Liste übertragen</button>
        </div>
        <div id="grid" class="grid"></div>
        <p id="empty" class="empty" hidden>Keine Spiele passen zu diesen Filtern.</p>
        <footer id="footer"></footer>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
